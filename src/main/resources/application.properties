
spring.application.name=tshirt-boutique
server.port=8080

# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/tshirt_boutique
spring.datasource.username=${DB_USERNAME:tshirt_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT Settings
app.jwt.secret=${JWT_SECRET_KEY}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# Security
spring.mvc.pathmatch.use-suffix-pattern=false

# Logging
logging.level.com.boutique.tshirtboutique=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Actuator (Health Check)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized